# Configuration file

general {
    # Automatically color ping bars
    B:autoColorPingBars=true

    # Automatically color ping text
    B:autoColorPingText=true

    # Hex color of ping bars
    S:barColor=0x00E676

    # List of ping values to ignore
    S:blacklistedPings <
     >

    # List of usernames to ignore (regex supported)
    S:blacklistedRegexes <
     >

    # List of server IPs to ignore
    S:blacklistedServerIps <
     >

    # Format string for ping display
    S:pingFormat=%dms

    # Render ping bars on screen
    B:renderPingBars=false

    # Render ping text on screen
    B:renderText=true

    # Hex color of ping text (e.g. 0xFF0000)
    S:textColor=0xA0A0A0

    # Horizontal offset for ping display
    I:xOffset=0
}


